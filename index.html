<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кальянные Миксы — ХАУС</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #F0EDE3;
    --card: #F7F4EA;
    --ink: #2C4A34;
    --ink-dim: #4A6350;
    --text: #2B2B26;
    --soft: #6b6a5f;
    --rule: #CFC9B6;
  }

  body {
    background: var(--paper);
    color: var(--text);
    font-family: 'PT Serif', serif;
    min-height: 100vh;
  }

  .page { max-width: 1080px; margin: 0 auto; padding: 60px 32px 90px; }

  /* HEADER */
  .header { text-align: center; margin-bottom: 46px; }

  .est {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--soft);
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: clamp(52px, 8vw, 84px);
    letter-spacing: 0.05em;
    color: var(--ink);
    line-height: 1;
    margin-top: 6px;
  }

  .brand-sub {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink);
    margin-top: 8px;
  }

  .menu-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 4.5vw, 38px);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    margin-top: 32px;
  }

  .menu-sub {
    font-style: italic;
    font-size: 15px;
    color: var(--soft);
    margin-top: 6px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--rule);
    margin: 26px auto 0;
  }

  /* FILTERS */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 30px;
  }
  .filter-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--soft);
    font-family: 'PT Serif', serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }
  .filter-btn:hover { border-color: var(--ink); color: var(--ink); }
  .filter-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .count-text {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--soft);
    margin-top: 16px;
  }

  /* GRID */
  .grid {
    margin-top: 44px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 26px 26px 22px;
    position: relative;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--ink-dim);
    box-shadow: 0 10px 24px rgba(44,74,52,0.08);
  }

  .card.hidden { display: none; }

  .card-tag {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 21px;
    color: var(--ink);
    line-height: 1.2;
  }

  .card-desc {
    font-style: italic;
    font-size: 13px;
    color: var(--soft);
  }

  .card-ingredients {
    font-size: 12.5px;
    color: var(--soft);
    line-height: 1.55;
    padding-top: 10px;
    border-top: 1px dotted var(--rule);
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 6px;
  }

  .strength-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--soft);
    margin-bottom: 5px;
  }

  .strength-bar { display: flex; gap: 3px; }
  .strength-pip {
    width: 15px;
    height: 3px;
    background: var(--rule);
  }
  .strength-pip.filled { background: var(--ink); }

  .strength-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 1;
  }
  .strength-den { font-size: 12px; color: var(--soft); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="est">Est. 2018</div>
    <div class="brand">ХАУС</div>
    <div class="brand-sub">на Волжской 34</div>

    <div class="menu-title">Кальянные миксы</div>
    <p class="menu-sub">готовые сочетания на любой вкус</p>
    <div class="divider"></div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-cat="all">Все</button>
    </div>
    <div class="count-text" id="count-text"></div>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
const mixes = [
  { cat: "Ягодные",          name: "Лесная ягода с марулой",              ingredients: "Лесные ягоды (50%), Марула (50%)" },
  { cat: "Ягодные",          name: "Ягодный Пинкман",                     ingredients: "Клубника (40%), Пинкман (40%), Тростниковая мята (20%)" },
  { cat: "Ягодные",          name: "Виноградный гранат с мятой",          ingredients: "Гранат и виноград (80%), Тростниковая мята (20%)" },
  { cat: "Ягодные",          name: "Ягодные леденцы с мандарином",        ingredients: "Ягодные леденцы (50%), Малина (30%), Апельсин и мандарин (20%)" },
  { cat: "Ягодные",          name: "Ягодный леденцовый бум",              ingredients: "Ягодные леденцы (50%), Яблочные конфеты (50%)" },
  { cat: "Ягодные",          name: "Шоколадный Пинкман",                  ingredients: "Пинкман (50%), Шоколад и мята (50%)" },
  { cat: "Фруктовые",        name: "Фейхоа & Киви-смузи",                 ingredients: "Фейхоа (60%), Киви-смузи (40%)" },
  { cat: "Фруктовые",        name: "Ананасовый Пинкман",                  ingredients: "Ананасовые колечки (70%), Пинкман (30%)" },
  { cat: "Фруктовые",        name: "Арбузно-дынный дуэт",                 ingredients: "Арбуз - Дыня (100%)" },
  { cat: "Фруктовые",        name: "Киви & Яблочные конфеты",             ingredients: "Киви-смузи (50%), Яблочные конфеты (50%)" },
  { cat: "Фруктовые",        name: "Ананас & Кокосовый Шейк",             ingredients: "Ананасовые колечки (50%), Пинкман (30%), Кокосовый шейк (20%)" },
  { cat: "Фруктовые",        name: "Шоколадная Дыня",                     ingredients: "Арбуз - Дыня (Дыня) (50%), Шоколад и мята (50%)" },
  { cat: "Фруктово-Ягодные", name: "Розовый смузи",                       ingredients: "Клубника (50%), Киви-смузи (50%)" },
  { cat: "Фруктово-Ягодные", name: "Тропическая Малина & Клубника",       ingredients: "Ананасовые колечки (40%), Малина (30%), Клубника (30%)" },
  { cat: "Фруктово-Ягодные", name: "Киви-Ананас с Земляникой и личи",     ingredients: "Киви-смузи (40%), Ананасовые колечки (30%), Земляника и личи (30%)" },
  { cat: "Фруктово-Ягодные", name: "Арбузно-ягодный леденец",             ingredients: "Гранат-вишня (40%), Арбуз - Дыня (Арбуз) (40%), Клубника (20%)" },
  { cat: "Фруктово-Ягодные", name: "Тропический фреш с земляникой",       ingredients: "Тропический сок (30%), Кокосовый шейк (30%), Земляника и личи (30%), Лесные ягоды (10%)" },
  { cat: "Фруктово-Ягодные", name: "Пинкман & Киви-смузи",                ingredients: "Пинкман (60%), Киви-смузи (30%), Тростниковая мята (10%)" },
  { cat: "Цитрусовые",       name: "Шоколадный Мандарин",                 ingredients: "Апельсин и мандарин (50%), Шоколад и мята (50%)" },
  { cat: "Цитрусовые",       name: "Пряный ананас с цитрусом",            ingredients: "Ананасовые колечки (60%), Лимон и лайм (20%), Эстрагон (20%)" },
  { cat: "Цитрусовые",       name: "Грейпфрутово-ягодный смэш",           ingredients: "Земляника и личи (40%), Грейпфрут (30%), Малина (30%)" },
  { cat: "Цитрусовые",       name: "Цитрусовый яблочный леденец",         ingredients: "Яблочные конфеты (40%), Киви-смузи (40%), Лимон и лайм (20%)" },
  { cat: "Цитрусовые",       name: "Травяной лимонад с лаймом",           ingredients: "Киви-смузи (40%), Лимон и лайм (30%), Эстрагон (20%), Тростниковая мята (10%)" },
  { cat: "Цитрусовые",       name: "Ежевично-цитрусовый бриз",            ingredients: "Лимон и лайм (50%), Арбуз - Дыня (Дыня) (30%), Ежевика (20%)" },
  { cat: "Напитки",          name: "Тархунный лимонад с ананасом",        ingredients: "Кислый ананас (50%), Лимончелло (30%), Эстрагон (20%)" },
  { cat: "Напитки",          name: "Ванильно-виноградная газировка",      ingredients: "Виноградный чупа-чупс (50%), Ванильная кола (30%), Тростниковая мята (20%)" },
  { cat: "Напитки",          name: "Огуречно-тропический джин",           ingredients: "Тропический сок (50%), Огуречный джин (50%)" },
  { cat: "Напитки",          name: "Ванильная Кола & Пинкман",            ingredients: "Ванильная кола (50%), Пинкман (50%)" },
  { cat: "Напитки",          name: "Пряный цитрусовый чай",               ingredients: "Апельсин и мандарин (40%), Гранат и виноград (30%), Шоколад и мята (30%)" },
  { cat: "Напитки",          name: "Грейпфрутовый Эрл Грей с малиной",    ingredients: "Грейпфрут (40%), Чай эрл грей (30%), Малина (30%)" },
  { cat: "Десертные",        name: "Тропическое мороженое (Пина Колада)", ingredients: "Ананасовые колечки (40%), Кокосовый шейк (30%), Сливочное мороженое (30%)" },
  { cat: "Десертные",        name: "Печенье с Пинкманом",                 ingredients: "Шоколадное печенье (50%), Пинкман (50%)" },
  { cat: "Десертные",        name: "Лимонно-ананасовая выпечка",          ingredients: "Шоколадное печенье (40%), Лимон и лайм (40%), Ананасовые колечки (20%)" },
  { cat: "Десертные",        name: "Шоколадно-мятная Дыня",               ingredients: "Шоколад и мята (50%), Арбуз - Дыня [Дыня] (50%)" },
  { cat: "Десертные",        name: "Лимонные вафли с мороженым",          ingredients: "Лимонные вафли (40%), Сливочное мороженое (40%), Тростниковая мята (20%)" },
  { cat: "Десертные",        name: "Персиковый йогурт с шоко-мятой",      ingredients: "Персиковый йогурт (50%), Шоколад и мята (30%), Сливочное мороженое (20%)" },
];

const cats = ["all", ...new Set(mixes.map(m => m.cat))];
const filtersEl = document.getElementById('filters');
const grid = document.getElementById('grid');
const countText = document.getElementById('count-text');

cats.slice(1).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.cat = cat;
  btn.textContent = cat;
  filtersEl.appendChild(btn);
});

mixes.forEach(mix => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.cat = mix.cat;

  card.innerHTML = `
    <div class="card-tag">${mix.cat}</div>
    <div class="card-name">${mix.name}</div>
    <div class="card-ingredients">${mix.ingredients}</div>
  `;
  grid.appendChild(card);
});

let activeFilter = 'all';

function updateCount() {
  const visible = [...grid.querySelectorAll('.card:not(.hidden)')].length;
  const total = mixes.length;
  countText.textContent = activeFilter === 'all' ? `${total} миксов` : `${visible} из ${total}`;
}

filtersEl.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeFilter = btn.dataset.cat;

  filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  grid.querySelectorAll('.card').forEach(card => {
    card.classList.toggle('hidden', !(activeFilter === 'all' || card.dataset.cat === activeFilter));
  });
  updateCount();
});

updateCount();
</script>
</body>
</html>
